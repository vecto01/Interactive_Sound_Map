<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Modal</title>
    <style>
        /* Основной стиль окна ошибки */
        .error-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .error-content {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 2rem;
            border-radius: 8px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        button.retry {
            background-color: #4CAF50;
            color: white;
        }
        button.retry:hover {
            background-color: #45a049;
        }
        
        button.close {
            background-color: #f44336;
            color: white;
        }
        button.close:hover {
            background-color: #d32f2f;
        }
        
        /* Темная тема */
        @media (prefers-color-scheme: dark) {
            .error-content {
                background-color: #333;
                color: #fff;
            }
            button {
                color: #fff;
            }
            button.retry {
                background-color: #4CAF50;
            }
            button.close {
                background-color: #f44336;
            }
        }
    </style>
</head>
<body>
    <div id="error-modal" class="error-modal" role="alert" aria-live="polite"></div>
    
    <script src="error-modal.js"></script>
</body>
</html>

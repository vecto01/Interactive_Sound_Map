<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Добавлен тест клавиатуры для проверки логики -->
    <script src="test_keyboard.js" defer></script>
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Скелетон-скрин для загрузки -->
    <div id="loading-container" class="loader-container" role="alert" aria-live="polite">
        <svg class="loader" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="none" stroke="#333" stroke-width="6"/>
        </svg>
        <div class="loading-message">Loading...</div>
        <div id="loading-checkmark" class="loading-checkmark"></div>
    </div>
    
    <!-- Скелетон-скрин для основного контента -->
    <div id="skeleton-container" style="display: none;">
        <div class="skeleton-line" style="width: 100%; height: 20px; background-color: #e0e0e0; margin-bottom: 15px;"></div>
        <div class="skeleton-line" style="width: 80%; height: 20px; background-color: #e0e0e0; margin-bottom: 15px;"></div>
        <div class="skeleton-line" style="width: 60%; height: 20px; background-color: #e0e0e0; margin-bottom: 20px;"></div>
        <div class="skeleton-line" style="width: 100%; height: 20px; background-color: #e0e0e0;"></div>
    </div>
    
    <!-- Основной контент с формой редактирования звука -->
    <div id="content-container" style="display: none;">
        <div id="sound-editor-container" role="dialog" aria-labelledby="sound-editor-title">
            <div class="editor-title">Редактировать звук</div>
            <input type="number" id="sound-input" placeholder="Введите длительность звука (в секундах)" min="1" max="10" tabindex="1" aria-label="Длина звука">
            <button id="save-sound-button" class="save-sound-button" tabindex="2" aria-label="Сохранить звук">Сохранить</button>
        </div>
    </div>
    
    <!-- Футер с информацией -->
    <footer id="footer" style="display: none;">
        <div class="footer-content">
            <p>Интерактивная карта звуковых эффектов</p>
            <p>© 2024 Vecto. Все права защищены.</p>
            <a href="#" style="color: #4CAF50; text-decoration: none;">Политика конфиденциальности</a>
        </div>
    </footer>
    
    <!-- Подключение дополнительных стилей для сообщений об ошибках и успехе -->
    <link rel="stylesheet" href="styles/error-success.css">
    <script src="src/main.js"></script>
    <script src="js/keyboard_controller.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Sound Map</title>
  <link rel="stylesheet" href="styles/loading.css">
</head>
<body>
  <div class="loading-container" id="loadingOverlay" aria-live="polite" aria-busy="true">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загрузка карты звуков...</div>
  </div>
  
  <div class="content" id="content-container">
    <div class="map-placeholder">
      <div class="loading-spinner-small"></div>
      <p class="loading-text-placeholder">Нажмите на метку на карте, чтобы прослушать звук.</p>
    </div>
    
    <div class="content-section">
      <h1>Интерактивная карта звуков</h1>
      <p>Исследуйте звуки с помощью интерактивной карты.</p>
      <button id="test-sound" class="button">Пробный звук</button>
    </div>
  </div>
  
  <div class="footer">
    <p class="footer-text">© 2024 Interactive Sound Map</p>
  </div>
  
  <script src="scripts/loading.js" defer></script>
</body>
</html>

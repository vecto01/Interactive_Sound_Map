<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="loading">
            <div class="loading-spinner" aria-live="polite" aria-busy="true"></div>
            <p class="loading-text" tabindex="0">Загрузка карты...</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingSpinner = document.querySelector('.loading-spinner');
            const loadingText = document.querySelector('.loading-text');
            
            setTimeout(() => {
                loadingSpinner.style.opacity = '0';
                loadingText.style.opacity = '0';
                loadingSpinner.style.animation = 'none';
                loadingText.style.animation = 'none';
                
                const successMessage = document.createElement('p');
                successMessage.className = 'success-message';
                successMessage.textContent = 'Готово! Карта загружена.';
                loading.appendChild(successMessage);
                
                successMessage.style.opacity = '0';
                setTimeout(() => {
                    successMessage.style.opacity = '1';
                }, 50);
                
                successMessage.style.marginTop = '20px';
            }, 2000);
        });
    </script>
</body>
</html>

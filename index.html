<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading-container" class="loading-screen" role="alert" aria-live="polite">
        <div class="loading-spinner"></div>
        <div class="loading-message">Loading...</div>
        <div class="loading-progress" style="display: none;">
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
    </div>
    <div id="test-load-container" tabindex="0" role="button" aria-label="Test sound loading functionality" style="display: none;">
        <button id="test-load-button" class="test-load-button" tabindex="0">Test Load Sound</button>
    </div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Sound Map</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="loading-indicator" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Загрузка карты...</div>
  </div>
  
  <div class="container">
    <div class="map-placeholder">
      <div class="map-skeleton" id="map-container">
        <svg viewBox="0 0 100 100" width="100%" height="100%" style="max-width: 400px; max-height: 300px;">
          <rect x="10" y="10" width="80" height="80" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
          <circle cx="20" cy="20" r="2" fill="#4CAF50" class="sound-marker"/>
          <circle cx="80" cy="20" r="2" fill="#4CAF50" class="sound-marker"/>
          <circle cx="20" cy="80" r="2" fill="#4CAF50" class="sound-marker"/>
          <circle cx="80" cy="80" r="2" fill="#4CAF50" class="sound-marker"/>
        </svg>
      </div>
      <div class="tooltip-container" id="tooltip-container">
        <div class="tooltip" id="tooltip">Нажмите на метку для прослушивания звука</div>
      </div>
      <p class="loading-text-placeholder">Нажмите на метку на карте, чтобы прослушать звук.</p>
    </div>
    
    <div class="content-section">
      <h1>Интерактивная карта звуков</h1>
      <button id="test-sound" class="button">Пробный звук</button>
    </div>
  </div>
  
  <div class="footer">
    <p class="footer-text">© 2024 Interactive Sound Map</p>
  </div>
  
  <script>
    // Анимация загрузки
    window.addEventListener('load', () => {
      const spinner = document.querySelector('.spinner');
      spinner.classList.add('complete');
      setTimeout(() => {
        document.getElementById('loadingOverlay').style.opacity = '0';
        document.getElementById('loadingOverlay').style.transition = 'opacity 0.5s ease-out';
        setTimeout(() => {
          document.getElementById('loadingOverlay').style.display = 'none';
          document.querySelector('.map-placeholder').style.opacity = '1';
          document.querySelector('.map-placeholder').style.transition = 'opacity 0.5s ease-out';
        }, 500);
      }, 1500);
    });
    
    // Анимация точек на карте
    document.querySelectorAll('.sound-marker').forEach(marker => {
      marker.addEventListener('mouseenter', () => {
        marker.style.transform = 'scale(1.2)';
        marker.style.transition = 'transform 0.3s ease-out';
        marker.style.fill = '#FF5722';
      });
      marker.addEventListener('mouseleave', () => {
        marker.style.transform = 'scale(1)';
        marker.style.fill = '#4CAF50';
      });
    });
    
    // Показ подсказки
    const tooltip = document.getElementById('tooltip');
    const tooltipContainer = document.getElementById('tooltip-container');
    
    document.querySelectorAll('.sound-marker').forEach(marker => {
      marker.addEventListener('mouseenter', () => {
        tooltip.style.display = 'block';
        tooltip.style.left = (marker.getBoundingClientRect().left + 10) + 'px';
        tooltip.style.top = (marker.getBoundingClientRect().top - 28) + 'px';
      });
      marker.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    });
    
    // Фиксированный хедер
    const header = document.querySelector('.content-section h1');
    window.addEventListener('scroll', () => {
      if (window.scrollY > header.offsetTop) {
        header.style.position = 'fixed';
        header.style.top = '0';
        header.style.backgroundColor = 'rgba(248, 249, 250, 0.9)';
      } else {
        header.style.position = 'relative';
      }
    });
  </script>
</body>
</html>
